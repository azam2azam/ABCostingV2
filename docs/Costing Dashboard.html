document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

        if (golden) weights = roster.map(id => GOLD_SHARES[id]);\n        const wSum = weights.reduce((a, b) => a + b, 0);\n        const list = [];\n        for (let i = 0; i < vol; i++) {\n          let pick = r() * wSum, di = 0;\n          for (let j = 0; j < weights.length; j++) { pick -= weights[j]; if (pick <= 0) { di = j; break; } }\n          const doc = world.doctors[roster[di]];\n          let mw = r() * M_WEIGHT.reduce((a, b) => a + b, 0), m = 0;\n          for (let j = 0; j < 8; j++) { mw -= M_WEIGHT[j]; if (mw <= 0) { m = j; break; } }\n          const t = M_START[m] + Math.floor(r() * M_LEN[m]);\n          let k = doc.kit % pkg.kits.length;\n          if (r() < 0.08) k = Math.floor(r() * pkg.kits.length);\n          let mat = pkg.kits[k].cost * (0.93 + r() * 0.16);\n          if (r() < 0.06) mat *= 1.18;\n          const ch = pkg.list * doc.cb * (0.97 + r() * 0.06);\n          const los = pkg.days + (r() < doc.pLong ? 1 : 0) + (r() < doc.pLong * 0.25 ? 1 : 0);\n          list.push({ t, m, doc: doc.id, ch, mat, los, rd: r() < doc.rd ? 1 : 0, inf: r() < doc.inf ? 1 : 0, k });\n        }\n        list.sort((a, b) => a.t - b.t);\n        world.cases[hid][pid] = list;\n      }\n    }\n  }\n  return world;\n}\n\nwindow.__MI_DATA = { START, DAYS, M_START, M_LEN, M_NAME, dayIdx, fmtDay, agg, byDoctor, buildWorld };\n})();\n<\u002Fscript>\n<script src=\"a6e338b9-d8cf-4aad-8297-523588c0f289\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <style>\n    body { margin: 0; background: #ffffff; color: #1d1d1f; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; text-wrap: pretty; }\n    a { color: #d1082a; text-decoration: none; }\n    a:hover { color: #e8112d; text-decoration: underline; }\n    input, select, button { font-family: inherit; }\n    input[type=\"date\"], select { color-scheme: light; }\n    select:focus-visible, input:focus-visible, button:focus-visi }\" hint-placeholder-val=\"{{ true }}\"><span>All figures synthetic &amp; illustrative<\u002Fspan><\u002Fsc-if>\n      <span>Period · {{ windowTxt }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;benchmarkTolerance&quot;: {&quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 5, &quot;min&quot;: 0, &quot;max&quot;: 15, &quot;step&quot;: 1, &quot;unit&quot;: &quot;%&quot;, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Analysis&quot;},\n  &quot;showOutcomes&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Compare&quot;},\n  &quot;showPocBadge&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Chrome&quot;}\n}\">\nconst MED_RE = /medication|drug|solution|epinephrine|contrast|viscoelastic|ovd|anaesthes|anesthes|cement|chemo|pre-op/i;\nconst FEMALE = ['Mona', 'Sara', 'Huda', 'Layla', 'Nadia', 'Dana', 'Reem', 'Aisha', 'Noura', 'Lina', 'Salma', 'Maha', 'Ghada', 'Farah', 'Hanan', 'Abeer'];\n\nclass Component extends DCLogic {\n  state = { world: null, view: 'home', hospId: null, deptId: null, pkgId: null,\n    from: '2026-01-01', to: '2026-08-16', cmp: ['', '', '', ''], hoverCol: null, hoverBar: null, bench: 'financial', deptSort: 'mat', deptDir: 'desc', pkgSort: 'mat', pkgDir: 'desc', mode: 'total', filtOpen: false, filtMetric: 'n', filtRule: 'all' };\n\n  FILT_METRICS = [['name', 'Name'], ['n', 'Packages performed'], ['mat', 'Resources charged'], ['ch', 'Amount billed'], ['claims', 'Claims received'], ['net', 'RC \\u2212 CR'], ['burn', 'RC \\u2212 CR %']];\n  filterVals() {\n    const s = this.state;\n    const deptTable = s.view === 'hosp';\n    const sortKey = deptTable ? s.deptSort : s.pkgSort;\n    const curDir = deptTable ? s.deptDir : s.pkgDir;\n    const set = patch => this.flash(patch);\n    const item = (on, label, patch) => ({\n      label, col: on ? '#1d1d1f' : '#6e6e73', weight: on ? '600' : '400',\n      line: on ? 'underline' : 'none', pick: () => set(patch)\n    });\n    const metric = this.FILT_METRICS.find(m => m[0] === sortKey) || this.FILT_METRICS[0];\n    return {\n      open: !!s.filtOpen,\n      btnLabel: metric[1] + ' \\u00b7 ' + (curDir === 'asc' ? 'low to high' : 'high to low'),\n      btnCol: '#1d1d1f',\n      btnBorder: 'rgba(0,0,0,0.14)',\n      toggle: () => this.setState({ filtOpen: !s.filtOpen }),\n      metrics: this.FILT_METRICS.map(([k, label]) => item(sortKey === k, label,\n        deptTable ? { deptSort: k } : { pkgSort: k })),\n      orders: [['asc', 'Lowest to highest'], ['desc', 'Highest to lowest']].map(([k, label]) =>\n        item(curDir === k, label, deptTable ? { deptDir: k, filtOpen: false } : { pkgDir: k, filtOpen: false }))\n    };\n  }\n\n  componentDidMount() {\n    const boot = m => { this.M = m; this.setState({ world: m.buildWorld() }); };\n    if (window.__MI_DATA) { boot(window.__MI_DATA); return; }\n    import(new URL('data.js', document.baseURI).href).then(boot).catch(e => console.error('world load failed', e));\n  }\n\n  mkGo(patch) { return e => { if (e && e.preventDefault) e.preventDefault(); this.setState(patch); window.scrollTo(0, 0); }; }\n  num(n) { return Math.round(n).toLocaleString('en-US'); }\n  pkgCode(id) { let h = 0; for (let i = 0; i < id.length; i++) h = (h * 131 + id.charCodeAt(i)) % 90000; return String(10000 + h); }\n  MK = 4.3216;   // package kit cost -> total material consumption\n  CH = 0.6345;   // charge scale\n  chS(n) { return n * this.CH; }\n  claimFactor(seed) { let h = 0; for (let i = 0; i < seed.length; i++) h = (h * 131 + seed.charCodeAt(i) * 7 + i * 29) % 100003; return 0.90 + (h % 61) / 1000; }\n  claimsFor(hid, pid, matRaw) { return this.matS(matRaw) * this.claimFactor(hid + '/' + pid); }\n  billFactor(seed) { let h = 0; for (let i = 0; i < seed.length; i++) h = (h * 137 + seed.charCodeAt(i) * 11 + i * 17) % 100019; return 0.96 + (h % 31) / 1000; }\n  billedFor(hid, pid, matRaw) { return this.matS(matRaw) * this.billFactor(hid + '/' + pid); }\n  physMoney(total, count) { return this.isAvg() ? this.sar(count ? total / count : 0) : this.sarK(total); }\n  claimShare(hid) { return 0.90 + ((hid.length * 37 + hid.charCodeAt(0)) % 70) / 1000; }\n  isAvg() { return this.state.mode === 'avg'; }\n  flash(patch) {\n    this.setState(Object.assign({}, patch, { flashing: true }));\n    clearTimeout(this._flashT);\n    this._flashT = setTimeout(() => this.setState({ flashing: false }), 30);\n  }\n  money(total, count) {\n    if (!this.isAvg()) return this.sarK(total);\n    return count ? this.sar(total / count) : '\\u2014';\n  }\n  moneyBare(total, count) {\n    if (!this.isAvg()) return this.bareK(total);\n    return count ? this.bare(total / count) : '\\u2014';\n  }\n  unit() { return this.isAvg() ? ' per package' : ''; }\n  qK(n) { if (n >= 1e6) return Math.round(n / 1e4) * 1e4; if (n >= 1e4) return Math.round(n / 1e3) * 1e3; return Math.round(n); }\n  qVal(total, count) { return this.isAvg() ? Math.round(count ? total / count : 0) : this.qK(total); }\n  qFmt(x) { return this.isAvg() ? this.num(x) : this.bareK(x); }\n  netSpend(received, spent, count) {\n    const R = this.qVal(received, count), S = this.qVal(spent, count);\n    const d = S - R, over = d >= 0;\n    const pct = S > 0 ? d / S : 0;\n    return { net: this.paren('SAR ' + this.qFmt(Math.abs(d)), d < 0), netCol: '#d1082a', netUp: over, netDown: !over,\n      burn: S > 0 ? this.paren(Math.abs(pct * 100).toFixed(0) + '%', pct < 0) : '\\u2014',\n      burnCol: '#d1082a', netRaw: d, pctRaw: pct };\n  }\n  paren(txt, neg) { return neg ? '(' + txt + ')' : txt; }\n  sarSigned(n) { return this.paren('SAR ' + this.num(Math.abs(n)), n < 0); }\n  physMat(total, count) { return this.isAvg() ? this.sar(this.matS(total / count)) : this.sarK(this.matS(total)); }\n  physCh(total, count) { return this.isAvg() ? this.sar(this.chS(total / count)) : this.sarK(this.chS(total)); }\n  matS(n) { return n * this.MK; }\n  sar(n) { return 'SAR ' + this.num(n); }\n  bare(n) { return this.num(n); }\n  bareK(n) { if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M'; if (n >= 1e4) return this.num(n / 1e3) + 'K'; return this.num(n); }\n  sarK(n) { if (n >= 1e6) return 'SAR ' + (n / 1e6).toFixed(2) + 'M'; if (n >= 1e4) return 'SAR ' + this.num(n / 1e3) + 'K'; return this.sar(n); }\n  pctTxt(x, d) { return (x * 100).toFixed(d == null ? 1 : d) + '%'; }\n  initials(name) { return name.replace('Dr. ', '').split(' ').map(w => w.replace('Al-', '').charAt(0)).join('').slice(0, 2).toUpperCase(); }\n  iso(d) { return new Date(Date.UTC(2026, 0, 1) + Math.max(0, Math.min(227, d)) * 864e5).toISOString().slice(0, 10); }\n  photo(name) {\n    const first = name.replace('Dr. ', '').split(' ')[0];\n    return FEMALE.indexOf(first) === -1 ? 'assets/doctor-male.png' : 'assets/doctor-female.png';\n  }\n\n  win() {\n    if (!this.M) return [0, 227];\n    let f = this.M.dayIdx(this.state.from), t = this.M.dayIdx(this.state.to);\n    if (!isFinite(f)) f = 0;\n    if (!isFinite(t)) t = 227;\n    f = Math.max(0, Math.min(227, f)); t = Math.max(0, Math.min(227, t));\n    if (t < f) t = f;\n    return [f, t];\n  }\n\n  // Stock-style delta: this window's value against the same-length window before it.\n  trend(now, prev) {\n    if (!prev) return { txt: 'new', col: '#86868b', up: false, down: false };\n    const d = (now - prev) / prev;\n    if (Math.abs(d) < 0.005) return { txt: 'flat', col: '#86868b', up: false, down: false };\n    return { txt: Math.abs(d * 100).toFixed(d > 0.1 || d < -0.1 ? 0 : 1) + '%',\n      col: d > 0 ? '#1a8f3c' : '#d1082a', up: d > 0, down: d < 0 };\n  }\n\n  delta(avg, list) {\n    const tol = (this.props.benchmarkTolerance ?? 5) / 100, d = (avg - list) / list;\n    if (Math.abs(d) <= tol) return { txt: 'At benchmark', col: '#86868b' };\n    const neg = d < 0;\n    return { txt: this.paren('SAR ' + this.num(Math.abs(avg - list)), neg) + ' \\u00b7 ' + this.paren(Math.abs(d * 100).toFixed(0) + '%', neg),\n      col: d > 0 ? '#b25000' : '#86868b' };\n  }\n\n  seedCmp(first, ids) {\n    const rest = ids.filter(x => x !== first);\n    const sel = (first ? [first] : []).concat(rest).slice(0, 3);\n    while (sel.length < 4) sel.push('');\n    return sel;\n  }\n\n  eStats() {\n    return { nTxt: '\\u2014', chTxt: '\\u2014', deltaTxt: '', deltaCol: '#86868b', contribTxt: '\\u2014', contribCol: '#1d1d1f',\n      claimsTxt: '\\u2014', rcTxt: '\\u2014', rcPct: '',\n      matTxt: '\\u2014', matCap: '', matCapCol: '#86868b', kit: '\\u2014', top: [],\n      losTxt: '\\u2014', losCol: '#1d1d1f', rdTxt: '\\u2014', rdCol: '#1d1d1f', infTxt: '\\u2014', infCol: '#1d1d1f',\n      lastTxt: '\\u2014', tipOn: false, tipTxt: '',\n      bars: [0,1,2,3,4,5,6,7].map(() => ({ h: '2px', bg: '#ececf0', tip: '', enter: () => {}, leave: () => {} })), hospN: '\\u2014', hospList: '',\n      t: { txt: '', col: '#86868b', up: false, down: false } };\n  }\n\n  periodDefs() {\n    return [['MTD', 212, 227], ['QTD', 181, 227], ['YTD', 0, 227], ['30d', 198, 227], ['90d', 138, 227]];\n  }\n\n  renderVals() {\n    const s = this.state, W = s.world, M = this.M;\n    const AV = ['linear-gradient(135deg,#ff375f,#8e0e1f)', 'linear-gradient(135deg,#ff8a3c,#e8112d)', 'linear-gradient(135deg,#ff5f8f,#a3122e)', 'linear-gradient(135deg,#c86bff,#8e0e1f)'];\n    const flat = { txt: '', col: '#86868b', up: false, down: false };\n    const v = {\n      showPoc: this.props.showPocBadge ?? true,\n      showOutcomes: this.props.showOutcomes ?? true,\n      goHome: this.mkGo({ view: 'home' }),\n      from: s.from, to: s.to,\n      setFrom: e => this.setState({ from: e.target.value || '2026-01-01' }),\n      setTo: e => this.setState({ to: e.target.value || '2026-08-16' }),\n      flashOp: s.flashing ? 0.1 : 1,\n      flashTr: s.flashing ? 'translateY(7px)' : 'none',\n      flashTrans: s.flashing ? 'none' : 'opacity 0.34s cubic-bezier(0.22,1,0.36,1), transform 0.34s cubic-bezier(0.22,1,0.36,1)',\n      unitTxt: this.unit(),\n      physChHead: this.isAvg() ? 'Avg charged' : 'Amount billed',\n      physMatHead: this.isAvg() ? 'Resources / case' : 'Resources charged',\n      physClaimsHead: this.isAvg() ? 'Claims / case' : 'Claims received',\n      cmpChCap: this.isAvg() ? 'Avg charged per case' : 'Amount billed',\n      cmpClaimsCap: this.isAvg() ? 'Claims received per case' : 'Claims received',\n      cmpRcCap: this.isAvg() ? 'Resources charged \\u2212 claims received per case' : 'Resources charged \\u2212 claims received',\n      cmpContribCap: this.isAvg() ? 'Charge minus materials per case' : 'Charge minus materials',\n      cmpMatCap: this.isAvg() ? 'Resources per case' : 'Resources charged',\n      cmpTopCap: this.isAvg() ? 'Top materials \\u00b7 per case' : 'Top materials \\u00b7 unit price',\n      modes: [['Total', 'total'], ['Average', 'avg']].map(([label, key]) => {\n        const on = s.mode === key;\n        return { label, fg: on ? '#ffffff' : '#6e6e73', bg: on ? '#e8112d' : 'rgba(0,0,0,0)',\n          pick: () => this.flash({ mode: key }) };\n      }),\n      periods: this.periodDefs().map(([label, a, b]) => {\n        const on = s.from === this.iso(a) && s.to === this.iso(b);\n        return { label, fg: on ? '#ffffff' : '#6e6e73', bg: on ? '#e8112d' : 'rgba(0,0,0,0)',\n          pick: () => this.setState({ from: this.iso(a), to: this.iso(b) }) };\n      }),\n      isHome: s.view === 'home', isHosp: s.view === 'hosp', isDept: s.view === 'dept',\n      isPkg: s.view === 'pkg', isCmp: s.view === 'cmp',\n      crumbs: [], hospRows: [], deptRows: [], deptCols: [], pkgCols: [], pkgRows: [], bomMaterial: [], bomMedication: [], kitRows: [], physRows: [], cols: [],\n      filt: this.filterVals(), filtNote: '',\n      gap: { pct: '', abs: '', title: '', col: '#86868b', up: false, down: false },\n      bridge: { pct: '', sar: '', count: '', title: '', col: '#86868b', cCol: '#86868b', cUp: false, cDown: false },\n      kCases: '', kMat: '', kAvgMat: '', kCharged: '', kClaims: '', windowTxt: '', hospCount: '',\n      tCases: flat, tMat: flat, tAvg: flat, tCh: flat, tClaims: flat, pTrend: flat,\n      hospName: '', hospKicker: '', hospLede: '',\n      deptFull: '', deptKicker: '', deptLede: '',\n      pkgKicker: '', pkgName: '', pkgDesc: '', pList: '', pAvgCh: '', pDeltaTxt: '', pDeltaCol: '#86868b',\n      pN: '', pAvgMat: '', stdTotal: '', matTotal: '', medTotal: '', pkgEmpty: false, goCompare: () => {},\n      cmpKicker: '', benchLine: '', losCap: '', benchModes: [],\n      kpi: { rows: [], gapPct: '', gapAbs: '', gapCol: '#86868b', gapTitle: '', bridgePct: '', bridgeSar: '', bridgeCount: '', bridgeCol: '#d1082a', bridgeCCol: '#86868b', bridgeCUp: false, bridgeCDown: false, bridgeTitle: '' }\n    };\n    if (!W || !M) return v;\n    const [f, t] = this.win();\n    const L = t - f;\n    // Prior comparison window: the same-length span before this one; when the window\n    // starts at the year's first day there is none, so compare its second half to its first.\n    const hasPrev = f > 0 || L >= 3;\n    const halfSplit = f === 0 && L >= 3;\n    const pf = halfSplit ? f : Math.max(0, f - L - 1);\n    const pt = halfSplit ? f + Math.floor(L / 2) : Math.max(0, f - 1);\n    const cf = halfSplit ? pt + 1 : f;\n    v.windowTxt = M.fmtDay(f) + ' \\u2014 ' + M.fmtDay(t);\n    const hosp = s.hospId ? W.hospitals[s.hospId] : null;\n    const dept = s.deptId ? W.depts[s.deptId] : null;\n    const pkg = s.pkgId ? W.packages[s.pkgId] : null;\n    const riyadh = W.regions.find(r => r.id === 'riyadh');\n    const tr = (now, prev) => hasPrev ? this.trend(now, prev) : flat;\n    const ICON = {\n      pkg: 'M3.5 8.5 12 4.5l8.5 4v7L12 19.5 3.5 15.5z M3.5 8.5 12 12.5l8.5-4M12 12.5v7',\n      mat: 'M2.5 7.5h19v11h-19z M2.5 7.5 6 4h12l3.5 3.5M12 4v3.5',\n      bill: 'M3 17.5 9.5 11l4 4L21 7.5 M15.5 7.5H21v5. => this.setState({ hoverCol: null }),\n            s: this.eStats()\n          };\n          if (!id || !W.doctors[id]) return col;\n          const doc = W.doctors[id];\n          col.has = true; col.name = doc.name; col.initials = this.initials(doc.name);\n          let opsTotal = 0;\n          col.hospOps = doc.hosps.map(hid => {\n            let hn = 0;\n            const byPkg = W.cases[hid] || {};\n            for (const pid2 in byPkg) for (const cse of byPkg[pid2]) if (cse.doc === id && cse.t >= f && cse.t <= t) hn++;\n            opsTotal += hn;\n            return { name: W.hospitals[hid].name, n: this.num(hn) };\n          });\n          col.hospOpsTotal = this.num(opsTotal);\n          col.showHosp = s.hoverCol === i;\n          col.isFemale = doc.female === true;\n          if (id === benchId) {\n            col.isBench = true; col.benchLabel = benchWord;\n            col.ringCol = 'rgba(201,162,39,0.85)';\n            col.ringShadow = '0 0 0 3px rgba(201,162,39,0.55), 0 0 22px rgba(201,162,39,0.40)';\n            col.ringAnim = 'goldPulse 2.6s ease-in-out infinite';\n          }\n          col.isMale = !col.isFemale;\n          col.sub = doc.grade + ' \\u00b7 ' + dd.name;\n          const af = aggFull[id];\n          const a = aggW[id] || null;\n          const st = col.s;\n          st.hospN = doc.hosps.length + (doc.hosps.length === 1 ? ' hospital' : ' hospitals');\n          st.hospList = doc.hosps.map(h => W.hospitals[h].name).join(' \\u00b7 ');\n          st.bars = af ? af.monthly.map((mv, mi) => {\n            const on = !(M.M_START[mi] > t || M.M_START[mi] + M.M_LEN[mi] - 1 < f);\n            return {\n              h: (mv === 0 ? 2 : 4 + Math.round(40 * mv / barMax)) + 'px',\n              bg: mv === 0 ? '#ececf0' : on ? 'linear-gradient(180deg,#ff4d5e,#e8112d)' : '#d2d2d7',\n              tip: M.M_NAME[mi] + ' 2026 \\u00b7 ' + mv + (mv === 1 ? ' case' : ' cases'),\n              enter: () => this.setState({ hoverBar: { i: i, mi: mi } }),\n              leave: () => this.setState({ hoverBar: null })\n            };\n          }) : [];\n          if (s.hoverBar && s.hoverBar.i === i && st.bars[s.hoverBar.mi]) {\n            st.tipOn = true; st.tipTxt = st.bars[s.hoverBar.mi].tip;\n          }\n          st.nTxt = a ? this.num(a.n) : '0';\n          st.t = tr(a ? a.n : 0, aggP[id] ? aggP[id].n : 0);\n          st.lastTxt = M.fmtDay(a && a.n ? a.last : (af ? af.last : -1));\n          if (a && a.n > 0) {\n            const billedAmt = this.billedFor(hosp.id, pkg.id, a.mat);\n            const avgCh = billedAmt / a.n, avgMat = this.matS(a.mat / a.n), std = this.matS(pkg.kits[0].cost);\n            const perCase = this.isAvg();\n            st.chTxt = perCase ? this.sar(avgCh) : this.sarK(billedAmt);\n            const d3 = this.delta(avgCh, this.chS(pkg.list));\n            st.deltaTxt = d3.txt; st.deltaCol = d3.col;\n            const contrib = perCase ? avgCh - avgMat : billedAmt - this.matS(a.mat);\n            st.contribTxt = perCase ? this.sarSigned(contrib) : this.paren(this.sarK(Math.abs(contrib)), contrib < 0);\n            st.contribCol = contrib < 0 ? '#d1082a' : '#1d1d1f';\n            st.matTxt = perCase ? this.sar(avgMat) : this.sarK(this.matS(a.mat));\n            const claimsAmt = this.claimsFor(hosp.id, pkg.id, a.mat), spentAmt = this.matS(a.mat);\n            const qS = this.qVal(spentAmt, a.n), qC = this.qVal(claimsAmt, a.n);\n            st.claimsTxt = perCase ? this.sar(qC) : this.sarK(claimsAmt);\n            st.rcTxt = 'SAR ' + this.qFmt(qS - qC);\n            st.rcPct = qS > 0 ? ((qS - qC) / qS * 100).toFixed(0) + '% of resources charged' : '';\n            const md = (avgMat - std) / std;\n            st.matCap = this.paren(Math.abs(md * 100).toFixed(0) + '%', md < 0) + ' vs standard kit';\n            st.matCapCol = md > 0.12 ? '#b25000' : '#86868b';\n            const kitBest = Object.keys(a.kits).sort((x, y) => a.kits[y] - a.kits[x])[0];\n            st.kit = kitBest != null ? pkg.kits[kitBest].k : '\\u2014';\n            st.top = kitBest != null ? [...pkg.kits[kitBest].items].sort((x, y) => y[1] * y[2] - x[1] * x[2]).slice(0, 3).map(it => ({ n: it[0], v: this.sar(this.matS(it[1])) + ' \\u00d7' + it[2] })) : [];\n            const avgLos = a.los / a.n;\n            st.losTxt = avgLos.toFixed(1) + ' days';\n            st.losCol = avgLos > pkg.days * 1.25 ? '#d1082a' : '#1d1d1f';\n            st.rdTxt = this.pctTxt(a.rd / a.n);\n            st.rdCol = a.rd / a.n > 0.05 ? '#d1082a' : '#1d1d1f';\n            st.infTxt = this.pctTxt(a.inf / a.n);\n            st.infCol = a.inf / a.n > 0.02 ? '#d1082a' : '#1d1d1f';\n          }\n          return col;\n        });\n      }\n    }\n    return v;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
