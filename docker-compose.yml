services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: verita-sql
    # Match Fly verita-abc-sql: shared-cpu-2x @ 2048MB (leave ~512MB under the
    # container cap so SQL can allocate lock blocks / buffers at startup).
    cpus: 2.0
    mem_limit: 2048m
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Verita!Dev123
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "1536"
    ports:
      - "1433:1433"
    volumes:
      - verita-sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: verita-api
    # Match Fly verita-abc-api: shared-cpu-1x @ 2048MB
    cpus: 1.0
    mem_limit: 2048m
    ports:
      - "5230:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Verita: "Server=host.docker.internal,1433;Database=Verita;User Id=sa;Password=Verita!Dev123;TrustServerCertificate=True;Encrypt=False"
      Jwt__Issuer: verita
      Jwt__Key: local-development-signing-key-change-me-0123456789abcdef
      Cors__Origins__0: http://localhost:4230
      Cors__Origins__1: http://127.0.0.1:4230
      # Claude intent router (off unless enabled). Set these in an untracked .env file next to this one.
      IntentRouter__Enabled: ${IntentRouter__Enabled:-false}
      IntentRouter__ApiKey: ${IntentRouter__ApiKey:-}
      IntentRouter__Model: ${IntentRouter__Model:-claude-haiku-5-5}

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: verita-web
    # Match Fly verita-abc-web: shared-cpu-1x @ 256MB
    cpus: 1.0
    mem_limit: 256m
    ports:
      - "4230:8080"

volumes:
  verita-sql-data:
