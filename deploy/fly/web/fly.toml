app = "verita-abc-web"
primary_region = "fra"

[build]
  dockerfile = "../../../Dockerfile.web"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
